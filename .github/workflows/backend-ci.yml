name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Reject committed environment files
        working-directory: .
        run: |
          if git ls-files \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -v -E '\.env\.example$'; then
            echo "Committed .env files are forbidden."
            exit 1
          fi

      - name: Reject privileged credentials in application files
        working-directory: .
        run: |
          if git grep -n -E \
            '(sb_secret_|SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL=postgres(ql)?://)' \
            -- backend mobile; then
            echo "A privileged credential pattern was found."
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy app tests

      - name: Test
        run: pytest -p no:cacheprovider
